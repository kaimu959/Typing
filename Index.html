<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイピング速度と音楽に関する探究実験</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h1 { text-align: center; color: #2c3e50; }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .text-display {
            font-size: 1.2rem;
            background: #eef2f5;
            padding: 15px;
            border-radius: 4px;
            letter-spacing: 1px;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .correct { color: #27ae60; font-weight: bold; }
        .current { background-color: #ffeaa7; text-decoration: underline; }
        .untyped { color: #7f8c8d; }
        textarea {
            width: 100%;
            height: 80px;
            font-size: 1.1rem;
            padding: 10px;
            border: 2px solid #3498db;
            border-radius: 4px;
            box-sizing: border-box;
            resize: none;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            font-weight: bold;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
        button:hover { background-color: #2980b9; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th { background-color: #3498db; color: white; }
    </style>
</head>
<body>

    <h1>タイピング計測アプリ (探究用)</h1>

    <div class="card">
        <label for="subjectName">被験者ID / 名前:</label>
        <input type="text" id="subjectName" placeholder="例: Aさん">

        <label for="musicCondition">音楽の条件:</label>
        <select id="musicCondition">
            <option value="無音">1. 無音（コントロール）</option>
            <option value="日本語歌詞あり">2. 日本語歌詞あり</option>
            <option value="英語歌詞あり">3. 英語歌詞あり</option>
            <option value="歌詞なし(BGM)">4. 歌詞なし（BGM/インスト）</option>
        </select>
    </div>

    <div class="card">
        <div class="text-display" id="textDisplay"></div>
        <textarea id="typingInput" placeholder="ここをクリックしてタイピングを開始してください..." disabled></textarea>

        <div class="stats">
            <span>経過時間: <span id="timer">0</span> 秒</span>
            <span>打鍵数 (KPM): <span id="kpm">0</span></span>
            <span>ミス数: <span id="errors">0</span></span>
        </div>
        <button id="startBtn" onclick="startTest()">テスト開始</button>
    </div>

    <div class="card">
        <h2>測定結果データ一覧</h2>
        <table id="resultTable">
            <thead>
                <tr>
                    <th>被験者</th>
                    <th>条件</th>
                    <th>時間(秒)</th>
                    <th>KPM (打鍵/分)</th>
                    <th>ミス数</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button onclick="downloadCSV()" style="background-color: #27ae60;">結果をCSV出力（Excel用）</button>
    </div>

    <script>
        const targetText = "kyouha iitenkidenode sanponi ikimashou. atarashii発見ga arumoshiremasen.";
        const displayText = "きょうは いいてんきなので さんぽに いきましょう。 あたらしい はっけんが あるかもしれません。";
        
        let timerInterval = null;
        let startTime = null;
        let isStarted = false;
        let errorCount = 0;
        let results = [];

        const displayEl = document.getElementById("textDisplay");
        const inputEl = document.getElementById("typingInput");
        const timerEl = document.getElementById("timer");
        const kpmEl = document.getElementById("kpm");
        const errorEl = document.getElementById("errors");

        function init() {
            displayEl.innerText = displayText + "\n(入力: " + targetText + ")";
        }

        function startTest() {
            inputEl.value = "";
            inputEl.disabled = false;
            inputEl.focus();
            isStarted = true;
            errorCount = 0;
            errorEl.innerText = "0";
            kpmEl.innerText = "0";
            timerEl.innerText = "0";
            
            startTime = new Date();
            clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 100);
            
            document.getElementById("startBtn").innerText = "計測中...";
            document.getElementById("startBtn").disabled = true;
        }

        function updateTimer() {
            const now = new Date();
            const elapsed = ((now - startTime) / 1000).toFixed(1);
            timerEl.innerText = elapsed;
        }

        inputEl.addEventListener("input", () => {
            if (!isStarted) return;

            const typed = inputEl.value;
            
            // ミスタイプの判定 (簡易)
            if (!targetText.startsWith(typed)) {
                errorCount++;
                errorEl.innerText = errorCount;
            }

            // KPM計算 (1分あたりの打鍵数)
            const elapsedMinutes = (new Date() - startTime) / 1000 / 60;
            if (elapsedMinutes > 0) {
                const currentKpm = Math.round(typed.length / elapsedMinutes);
                kpmEl.innerText = currentKpm;
            }

            // 終了判定
            if (typed === targetText) {
                finishTest();
            }
        });

        function finishTest() {
            clearInterval(timerInterval);
            isStarted = false;
            inputEl.disabled = true;

            const endTime = new Date();
            const totalTime = ((endTime - startTime) / 1000).toFixed(2);
            const finalKpm = Math.round(targetText.length / (totalTime / 60));

            const name = document.getElementById("subjectName").value || "匿名";
            const condition = document.getElementById("musicCondition").value;

            // 結果の保存
            const resultData = { name, condition, time: totalTime, kpm: finalKpm, errors: errorCount };
            results.push(resultData);

            // テーブルへの反映
            const tbody = document.querySelector("#resultTable tbody");
            const row = `<tr>
                <td>${name}</td>
                <td>${condition}</td>
                <td>${totalTime}</td>
                <td>${finalKpm}</td>
                <td>${errorCount}</td>
            </tr>`;
            tbody.insertAdjacentHTML("beforeend", row);

            alert(`お疲れ様でした！\nタイム: ${totalTime}秒\nKPM: ${finalKpm}`);
            
            document.getElementById("startBtn").innerText = "次のテストを開始";
            document.getElementById("startBtn").disabled = false;
        }

        function downloadCSV() {
            if (results.length === 0) {
                alert("出力するデータがありません。");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,被験者,条件,時間(秒),KPM,ミス数\n";
            results.forEach(r => {
                csvContent += `${r.name},${r.condition},${r.time},${r.kpm},${r.errors}\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "typing_experiment_results.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        init();
    </script>
</body>
</html>
