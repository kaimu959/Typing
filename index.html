<script>
/* =========================================================================
   このサイト専用の簡易ストレージ(localStorage を使用)
   ------------------------------------------------------------------------
   もともとのコードにあった window.storage は、Claude のアーティファクト機能
   専用のAPIで、GitHub Pagesなど外部のサイトには存在しません。
   ここでは同じ形の関数(get/set/delete/list)を、ブラウザの localStorage を
   使って自作しています。

   ★重要な制限:localStorage は「今開いているその端末・そのブラウザの中」
   にしかデータを保存できません。友達が自分のスマホでこのページを開いて
   回答しても、あなたのパソコンには届きません。複数人のデータを1か所に
   集めたい場合は、別の仕組み(Googleスプレッドシート連携など)が必要です。
   ========================================================================= */
(function () {
  function fullKey(key, shared) {
    return (shared ? "shared::" : "priv::") + key;
  }
  window.storage = {
    get: async function (key, shared) {
      const raw = localStorage.getItem(fullKey(key, shared));
      if (raw === null) {
        throw new Error("not found: " + key);
      }
      return { key: key, value: raw, shared: !!shared };
    },
    set: async function (key, value, shared) {
      localStorage.setItem(fullKey(key, shared), value);
      return { key: key, value: value, shared: !!shared };
    },
    delete: async function (key, shared) {
      localStorage.removeItem(fullKey(key, shared));
      return { key: key, deleted: true, shared: !!shared };
    },
    list: async function (prefix, shared) {
      const p = shared ? "shared::" : "priv::";
      const fullPrefix = p + (prefix || "");
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.indexOf(fullPrefix) === 0) {
          keys.push(k.slice(p.length));
        }
      }
      return { keys: keys, prefix: prefix, shared: !!shared };
    },
  };
})();
</script>

<script type="text/babel">
const { useState, useRef, useMemo, useEffect, useCallback } = React;

/* ---------------------------------------------------------------------
   アイコンの代わり(絵文字)。元コードは lucide-react を使っていましたが、

function Ic({ e, size = 14, style }) {

    </span>
  );
}

/* ---------------------------------------------------------------------
   シンプルな自作バーチャート(元コードは recharts を使っていましたが、
   外部ライブラリなしで動かすため、divベースの棒グラフに置き換えています)
   --------------------------------------------------------------------- */
function SimpleBarChart({ data, valueKey, maxValue, unit }) {
  return (
    <div className="tm-bars">
      {data.map((d) => {
        const val = d[valueKey];
        const pct = maxValue > 0 ? Math.min(100, (val / maxValue) * 100) : 0;
        return (
          <div className="tm-bar-col" key={d.key}>
            <div className="tm-bar-track">
              <div
                className="tm-bar-fill"
                style={{ height: pct + "%", background: d.color }}
              />
            </div>
            <div className="tm-bar-value">
              {val}
              <span style={{ color: "var(--muted)", fontSize: 11 }}>{unit}</span>
            </div>
            <div className="tm-bar-label">{d.short}</div>
          </div>
        );
      })}
    </div>
  );
}

/* =========================================================================
   探究用調査サイト:「タイピング速度と音楽(歌詞)の関係」
   ------------------------------------------------------------------------
   ・参加者は「無音 / 歌詞のない音楽 / 歌詞のある音楽」の3条件でタイピングを行う
   ・各条件のタイピング速度(文字/分)と正確度(%)を記録する
   ・結果はブラウザ内ストレージに保存され、研究者ダッシュボードで集計・CSV出力できる
   ========================================================================= */

const CONDITIONS = {
  silent: {
    key: "silent",
    label: "無音",
    short: "無音",
    color: "#9CA3C4",
    instruction:
      "身の回りの音楽・動画を止めて、できるだけ静かな環境を作ってください。イヤホンをしている場合は外してください。",
  },
  instrumental: {
    key: "instrumental",
    label: "歌詞のない音楽",
    short: "歌詞なし",
    color: "#6FCF97",
    instruction:
      "お手元の音楽プレーヤーで、歌詞のない曲(クラシック・ローファイ・BGMなど)を再生してください。再生を始めたら、次に進んでください。",
  },
  lyrics: {
    key: "lyrics",
    label: "歌詞のある音楽",
    short: "歌詞あり",
    color: "#E8B04B",
    instruction:
      "お手元の音楽プレーヤーで、歌詞のある好きな曲を再生してください。再生を始めたら、次に進んでください。",
  },
};

const PASSAGE_POOL = [
  "駅前の商店街には昔から続く小さな喫茶店があり、常連客が静かに新聞を読んでいる。",
  "夏休みの図書館は冷房が効いていて、受験生たちが黙々と参考書に向き合っている。",
  "早朝の公園ではラジオ体操をする高齢者の声が響き、犬を連れた人が挨拶を交わす。",
  "新しく買ったキーボードは打鍵音が静かで、深夜でも気にせず作業を続けられる。",
  "山の頂上から見下ろす街並みは思ったより小さく、風が想像以上に強く吹いていた。",
  "台所からは味噌汁のにおいが漂い、炊飯器が炊き上がりを知らせる音を鳴らした。",
  "自転車で通り過ぎた田んぼには稲穂が並び、夕方の光を受けて金色に揺れていた。",
  "文化祭の準備で教室にはペンキの匂いが広がり、生徒たちは笑いながら看板を作った。",
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function makeParticipantId(nickname) {
  const suffix = Math.random().toString(36).slice(2, 6);
  const base = (nickname || "ゲスト").trim() || "ゲスト";
  return `${base}-${suffix}`;
}

function toCSV(records) {
  const header = ["参加者", "条件", "実施順", "CPM(文字/分)", "正確度(%)", "所要時間(秒)", "日時"];
  const lines = [header.join(",")];
  records.forEach((r) => {
    const row = [
      r.participant,
      CONDITIONS[r.condition]?.label ?? r.condition,
      r.orderIndex,
      r.cpm,
      r.accuracy,
      r.elapsedSec,
      new Date(r.timestamp).toLocaleString("ja-JP"),
    ].map((v) => `"${String(v).replace(/"/g, '""')}"`);
    lines.push(row.join(","));
  });
  return lines.join("\n");
}

/* ----------------------------- 円形ゲージ ----------------------------- */
function RadialGauge({ value, max, label, unit, color }) {
  const pct = Math.max(0, Math.min(1, value / max));
  const deg = pct * 360;
  return (
    <div className="gauge">
      <div
        className="gauge-ring"
        style={{
          background: `conic-gradient(${color} ${deg}deg, rgba(255,255,255,0.08) ${deg}deg)`,
        }}
      >
        <div className="gauge-inner">
          <span className="gauge-value">{value}</span>
          <span className="gauge-unit">{unit}</span>
        </div>
      </div>
      <span className="gauge-label">{label}</span>
    </div>
  );
}

function TypingMusicStudy() {
  const [screen, setScreen] = useState("home"); // home, register, instruction, typing, trialResult, finished, researcher
  const [nickname, setNickname] = useState("");
  const [grade, setGrade] = useState("");
  const [agreed, setAgreed] = useState(false);
  const [participantId, setParticipantId] = useState("");

  const [conditionOrder, setConditionOrder] = useState([]);
  const [assignedPassages, setAssignedPassages] = useState({});
  const [trialIndex, setTrialIndex] = useState(0);
  const [trialResults, setTrialResults] = useState([]);

  const [inputValue, setInputValue] = useState("");
  const [lastTrial, setLastTrial] = useState(null);
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState("");

  const startTimeRef = useRef(null);
  const keystrokeRef = useRef(0);

  // researcher
  const [researcherRecords, setResearcherRecords] = useState(null);
  const [researcherLoading, setResearcherLoading] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [resetting, setResetting] = useState(false);

  const currentConditionKey = conditionOrder[trialIndex];
  const currentCondition = currentConditionKey ? CONDITIONS[currentConditionKey] : null;
  const currentPassage = currentConditionKey ? assignedPassages[currentConditionKey] : "";

  /* ------------------------------- 登録 ------------------------------- */
  const beginStudy = () => {
    const order = shuffle(Object.keys(CONDITIONS));
    const passages = shuffle(PASSAGE_POOL).slice(0, 3);
    const mapping = {};
    order.forEach((c, i) => (mapping[c] = passages[i]));
    setConditionOrder(order);
    setAssignedPassages(mapping);
    setParticipantId(makeParticipantId(nickname));
    setTrialIndex(0);
    setTrialResults([]);
    setScreen("instruction");
  };

  /* ------------------------------ タイピング ------------------------------ */
  const startTyping = () => {
    setInputValue("");
    startTimeRef.current = null;
    keystrokeRef.current = 0;
    setScreen("typing");
  };

  const finalizeTrial = useCallback(
    async (finalValue) => {
      const elapsedMs = Date.now() - (startTimeRef.current ?? Date.now());
      const elapsedSec = Math.max(0.5, elapsedMs / 1000);
      const cpm = Math.round(currentPassage.length / (elapsedSec / 60));
      const keystrokes = Math.max(keystrokeRef.current, currentPassage.length);
      const accuracy = Math.min(100, Math.round((currentPassage.length / keystrokes) * 100));

      const record = {
        participant: participantId,
        condition: currentConditionKey,
        orderIndex: trialIndex + 1,
        cpm,
        accuracy,
        elapsedSec: Math.round(elapsedSec * 10) / 10,
        passageLength: currentPassage.length,
        timestamp: Date.now(),
      };

      setLastTrial(record);
      setTrialResults((prev) => [...prev, record]);
      setSaving(true);
      setSaveError("");
      try {
        const key = `trial:${participantId}:${currentConditionKey}:${record.timestamp}`;
        const result = await window.storage.set(key, JSON.stringify(record), true);
        if (!result) throw new Error("保存に失敗しました");
      } catch (e) {
        setSaveError("データの保存に失敗しました。ブラウザの設定を確認してもう一度お試しください。");
      } finally {
        setSaving(false);
      }
      setScreen("trialResult");
    },
    [currentPassage, currentConditionKey, participantId, trialIndex]
  );

  const handleInputChange = (e) => {
    const value = e.target.value;
    if (value.length > currentPassage.length) return; // 長すぎる入力は無視
    if (startTimeRef.current === null && value.length > 0) {
      startTimeRef.current = Date.now();
    }
    keystrokeRef.current += 1;
    setInputValue(value);
    if (value === currentPassage) {
      finalizeTrial(value);
    }
  };

  const goNextTrial = () => {
    if (trialIndex + 1 < conditionOrder.length) {
      setTrialIndex((i) => i + 1);
      setScreen("instruction");
    } else {
      setScreen("finished");
    }
  };

  const resetAll = () => {
    setScreen("home");
    setNickname("");
    setGrade("");
    setAgreed(false);
    setTrialResults([]);
    setTrialIndex(0);
  };

  /* ----------------------------- 研究者ダッシュボード ----------------------------- */
  const loadResearcherData = useCallback(async () => {
    setResearcherLoading(true);
    try {
      const listRes = await window.storage.list("trial:", true);
      const keys = listRes?.keys || [];
      const values = await Promise.all(
        keys.map((k) => window.storage.get(k, true).catch(() => null))
      );
      const records = values.filter(Boolean).map((v) => JSON.parse(v.value));
      records.sort((a, b) => b.timestamp - a.timestamp);
      setResearcherRecords(records);
    } catch (e) {
      setResearcherRecords([]);
    } finally {
      setResearcherLoading(false);
    }
  }, []);

  useEffect(() => {
    if (screen === "researcher") loadResearcherData();
  }, [screen, loadResearcherData]);

  const aggregates = useMemo(() => {
    if (!researcherRecords) return [];
    return Object.keys(CONDITIONS).map((key) => {
      const rows = researcherRecords.filter((r) => r.condition === key);
      const n = rows.length;
      const avgCpm = n ? Math.round(rows.reduce((s, r) => s + r.cpm, 0) / n) : 0;
      const avgAcc = n ? Math.round(rows.reduce((s, r) => s + r.accuracy, 0) / n) : 0;
      return { ...CONDITIONS[key], n, avgCpm, avgAcc };
    });
  }, [researcherRecords]);

  const maxCpm = useMemo(() => {
    const m = Math.max(1, ...aggregates.map((a) => a.avgCpm));
    return Math.ceil(m * 1.2);
  }, [aggregates]);

  const handleExportCSV = () => {
    if (!researcherRecords || researcherRecords.length === 0) return;
    const csv = toCSV(researcherRecords);
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "typing_music_data.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleResetData = async () => {
    setResetting(true);
    try {
      const listRes = await window.storage.list("trial:", true);
      const keys = listRes?.keys || [];
      await Promise.all(keys.map((k) => window.storage.delete(k, true).catch(() => null)));
      await loadResearcherData();
    } finally {
      setResetting(false);
      setConfirmReset(false);
    }
  };

  /* --------------------------------- 画面 --------------------------------- */
  return (
    <div className="tm-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

        .tm-root {
          --bg: #1B1E2B;
          --surface: #242840;
          --surface2: #2E3352;
          --text: #EDEFF7;
          --muted: #9CA3C4;
          --accent: #E8B04B;
          --mint: #6FCF97;
          --coral: #E8637A;
          --line: rgba(255,255,255,0.09);
          min-height: 100vh;
          background: radial-gradient(1200px 800px at 50% -10%, #2a2f4a 0%, var(--bg) 55%);
          color: var(--text);
          font-family: 'Zen Kaku Gothic New', sans-serif;
          padding: 32px 16px 64px;
          box-sizing: border-box;
        }
        .tm-root * { box-sizing: border-box; }
        .tm-shell { max-width: 560px; margin: 0 auto; }
        .tm-shell.wide { max-width: 880px; }

        .tm-nav {
          display: flex; align-items: center; justify-content: space-between;
          margin-bottom: 28px; font-size: 13px; color: var(--muted);
        }
        .tm-nav-brand { display:flex; align-items:center; gap:8px; letter-spacing: 0.04em; }
        .tm-nav-link {
          background: none; border: none; color: var(--muted); cursor: pointer;
          font-family: inherit; font-size: 13px; display:flex; align-items:center; gap:4px;
          padding: 4px 0; border-bottom: 1px solid transparent;
        }
        .tm-nav-link:hover { color: var(--text); border-bottom-color: var(--line); }

        .tm-eyebrow {
          font-size: 12px; letter-spacing: 0.14em; color: var(--accent);
          text-transform: uppercase; margin-bottom: 14px; display:flex; align-items:center; gap:8px;
        }
        .tm-title {
          font-family: 'Shippori Mincho', serif; font-weight: 800;
          font-size: clamp(28px, 6vw, 42px); line-height: 1.35; margin: 0 0 18px;
        }
        .tm-lead { color: var(--muted); font-size: 15.5px; line-height: 1.9; margin: 0 0 28px; }

        .tm-measure {
          display:flex; gap:0; margin-bottom: 22px; font-family: 'JetBrains Mono', monospace;
          font-size: 13px; color: var(--muted); align-items:center;
        }
        .tm-measure span { padding: 0 10px; }
        .tm-measure .bar { color: var(--line); }
        .tm-measure .active { color: var(--accent); font-weight: 600; }
        .tm-measure .done { color: var(--mint); }

          background: linear-gradient(180deg, var(--surface), var(--surface2));

        .tm-stat-card .n { font-family: 'JetBrains Mono', monospace; color: var(--muted); font-size: 12px; }
        .tm-stat-card .label { display:flex; align-items:center; gap:8px; font-size: 13.5px; margin-bottom: 10px; }
        .tm-stat-card .value { font-family: 'Shippori Mincho', serif; font-size: 26px; font-weight: 800; }
        .tm-stat-card .value small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 4px; }

        .tm-chart-block { margin-bottom: 30px; }
        .tm-chart-title { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

        .tm-bars { display:flex; align-items:flex-end; justify-content:center; gap: 28px; height: 200px; }
        .tm-bar-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; width:64px; }
        .tm-bar-track { flex:1; width:36px; display:flex; align-items:flex-end; background: rgba(255,255,255,0.05); border-radius:6px; overflow:hidden; }
        .tm-bar-fill { width:100%; border-radius:6px 6px 0 0; transition: height 0.4s ease; }
        .tm-bar-value { margin-top:8px; font-family:'JetBrains Mono',monospace; font-size:13px; }
        .tm-bar-label { margin-top:4px; font-size:12px; color:var(--muted); }

        .tm-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 24px; }
        .tm-table { width: 100%; border-collapse: collapse; font-size: 13px; font-family: 'JetBrains Mono', monospace; }
        .tm-table th, .tm-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
        .tm-table th { color: var(--muted); font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 500; background: rgba(255,255,255,0.03); }
        .tm-table tr:last-child td { border-bottom: none; }

        .tm-actions { display:flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
        .tm-error { color: var(--coral); font-size: 13px; margin-top: 10px; }
        .tm-empty { color: var(--muted); font-size: 14px; padding: 20px 0; text-align:center; }

        .tm-confirm-box { background: rgba(232,99,122,0.1); border: 1px solid var(--coral); border-radius: 12px; padding: 16px; margin-bottom: 20px; font-size: 13.5px; }

        .tm-note { background: rgba(232,176,75,0.08); border: 1px solid rgba(232,176,75,0.3); border-radius: 12px; padding: 14px 16px; font-size: 13px; color: var(--muted); margin-bottom: 24px; line-height: 1.7; }
      `}</style>

      {/* ---------------------------- ホーム ---------------------------- */}
      {screen === "home" && (
        <div className="tm-shell">
          <div className="tm-nav">
            <div className="tm-nav-brand">
              <Ic e="🎵" size={15} />
              探究:タイピング × 音楽
            </div>
            <button className="tm-nav-link" onClick={() => setScreen("researcher")}>
              研究者用ダッシュボード <Ic e="→" size={13} />
            </button>
          </div>

          <div className="tm-eyebrow">
            <Ic e="⌨️" size={14} /> 調査への協力依頼
          </div>
          <h1 className="tm-title">歌詞は、指を止める?</h1>
          <p className="tm-lead">
            音楽を聴きながら作業すると集中できる人もいれば、歌詞が気になって手が止まる人もいます。
            この調査では「無音」「歌詞のない音楽」「歌詞のある音楽」の3つの条件でそれぞれ短い文章をタイピングしてもらい、
            入力速度(CPM・1分あたりの文字数)と正確度の変化を記録します。所要時間は3分ほどです。
          </p>
          <div className="tm-card">
            <p style={{ margin: "0 0 20px", fontSize: 14, color: "var(--muted)", lineHeight: 1.8 }}>
              音楽の再生はご自身のスマートフォンやプレーヤーで行ってください。このサイトは指示の表示とタイピング測定のみを行います。
            </p>
            <button className="tm-btn" onClick={() => setScreen("register")}>
              調査に協力する <Ic e="→" size={16} />
            </button>
          </div>
        </div>
      )}

      {/* ---------------------------- 参加者登録 ---------------------------- */}
      {screen === "register" && (
        <div className="tm-shell">
          <div className="tm-eyebrow">
            <Ic e="📋" size={14} /> 参加者情報
          </div>
          <h1 className="tm-title" style={{ fontSize: 30 }}>
            はじめる前に
          </h1>
          <div className="tm-card">
            <div className="tm-field">
              <label>ニックネーム(本名でなくてOK)</label>
              <input
                type="text"
                value={nickname}
                onChange={(e) => setNickname(e.target.value)}
                placeholder="例:たけし"
              />
            </div>
            <div className="tm-field">
              <label>学年・立場(任意)</label>
              <input
                type="text"
                value={grade}
                onChange={(e) => setGrade(e.target.value)}
                placeholder="例:高校2年"
              />
            </div>
            <label className="tm-check">
              <input type="checkbox" checked={agreed} onChange={(e) => setAgreed(e.target.checked)} />
              入力したニックネームとタイピング結果は、探究学習の分析目的のみに使用され、他の参加者にも集計データとして共有されることに同意します。
            </label>
            <div className="tm-actions">
              <button className="tm-btn" disabled={!agreed} onClick={beginStudy}>
                次へ <Ic e="→" size={16} />
              </button>
              <button className="tm-btn ghost" onClick={() => setScreen("home")}>
                戻る
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ---------------------------- 条件の指示 ---------------------------- */}
      {screen === "instruction" && currentCondition && (
        <div className="tm-shell">
          <div className="tm-measure">
            {conditionOrder.map((c, i) => (
              <React.Fragment key={c}>
                {i > 0 && <span className="bar">｜</span>}
                <span className={i < trialIndex ? "done" : i === trialIndex ? "active" : ""}>
                  {i + 1}
                </span>
              </React.Fragment>
            ))}
            <span style={{ marginLeft: 10 }}>/ 全{conditionOrder.length}条件</span>
          </div>

          <div
            className="tm-condition-badge"
            style={{ borderColor: currentCondition.color }}
          >
            <span className="tm-dot" style={{ background: currentCondition.color }} />
            条件 {trialIndex + 1}:{currentCondition.label}
          </div>

          <h1 className="tm-title" style={{ fontSize: 28 }}>
            準備ができたら開始してください
          </h1>

          <div className="tm-card">
            <p className="tm-instruction-text">{currentCondition.instruction}</p>
            <p style={{ fontSize: 13, color: "var(--muted)", marginBottom: 24 }}>
              開始すると短い日本語の文章が表示されます。表示された文章を、できるだけ速く・正確に入力してください。
            </p>
            <button className="tm-btn" onClick={startTyping}>
              タイピングを開始 <Ic e="→" size={16} />
            </button>
          </div>
        </div>
      )}

      {/* ---------------------------- タイピング画面 ---------------------------- */}
      {screen === "typing" && currentCondition && (
        <div className="tm-shell">
          <div
            className="tm-condition-badge"
            style={{ borderColor: currentCondition.color }}
          >
            <span className="tm-dot" style={{ background: currentCondition.color }} />
            条件 {trialIndex + 1}:{currentCondition.label}
          </div>
          <div className="tm-meta-row">
            <span>{inputValue.length} / {currentPassage.length} 文字</span>
            <span>正しく最後まで入力すると自動で終了します</span>
          </div>
          <div className="tm-passage">
            {currentPassage.split("").map((ch, i) => {
              let cls = "char-pending";
              if (i < inputValue.length) cls = inputValue[i] === ch ? "char-correct" : "char-wrong";
              else if (i === inputValue.length) cls = "char-caret";
              return (
                <span key={i} className={cls}>
                  {ch}
                </span>
              );
            })}
          </div>
          <input
            className="tm-typing-input"
            type="text"
            value={inputValue}
            onChange={handleInputChange}
            onPaste={(e) => e.preventDefault()}
            autoFocus
            placeholder="ここに入力してください"
          />
        </div>
      )}

      {/* ---------------------------- 1条件ごとの結果 ---------------------------- */}
      {screen === "trialResult" && lastTrial && (
        <div className="tm-shell">
          <div className="tm-eyebrow">
            <Ic e="✅" size={14} /> 条件 {lastTrial.orderIndex} 完了
          </div>
          <h1 className="tm-title" style={{ fontSize: 28 }}>
            {CONDITIONS[lastTrial.condition].label} の結果
          </h1>
          <div className="tm-card">
            <div className="tm-result-grid">
              <RadialGauge
                value={lastTrial.cpm}
                max={400}
                label="タイピング速度"
                unit="文字/分"
                color={CONDITIONS[lastTrial.condition].color}
              />
              <RadialGauge
                value={lastTrial.accuracy}
                max={100}
                label="正確度"
                unit="%"
                color="var(--mint)"
              />
            </div>
            {saving && <p style={{ fontSize: 13, color: "var(--muted)" }}>保存中…</p>}
            {saveError && <p className="tm-error">{saveError}</p>}
            <button className="tm-btn" onClick={goNextTrial}>
              {trialIndex + 1 < conditionOrder.length ? "次の条件へ" : "結果を確認する"}
              <Ic e="→" size={16} />
            </button>
          </div>
        </div>
      )}

      {/* ---------------------------- 全条件終了 ---------------------------- */}
      {screen === "finished" && (
        <div className="tm-shell">
          <div className="tm-eyebrow">
            <Ic e="✅" size={14} /> 調査完了
          </div>
          <h1 className="tm-title" style={{ fontSize: 30 }}>
            ご協力ありがとうございました
          </h1>
          <p className="tm-lead">
            3つの条件すべてのタイピング結果を記録しました。あなたのデータは研究者ダッシュボードの集計に反映されます。
          </p>
          <div className="tm-card">
            {trialResults
              .slice()
              .sort((a, b) => a.orderIndex - b.orderIndex)
              .map((r) => (
                <div className="tm-summary-row" key={r.orderIndex}>
                  <div className="tm-summary-label">
                    <span className="tm-dot" style={{ background: CONDITIONS[r.condition].color }} />
                    {CONDITIONS[r.condition].label}
                  </div>
                  <div className="tm-summary-values">
                    <span><b>{r.cpm}</b> 文字/分</span>
                    <span><b>{r.accuracy}</b>%</span>
                  </div>
                </div>
              ))}
            <div className="tm-actions" style={{ marginTop: 22 }}>
              <button className="tm-btn" onClick={resetAll}>
                <Ic e="🏠" size={16} /> もう一度別の人が回答する
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ---------------------------- 研究者ダッシュボード ---------------------------- */}
      {screen === "researcher" && (
        <div className="tm-shell wide">
          <div className="tm-nav">
            <div className="tm-nav-brand">
              <Ic e="📋" size={15} /> 研究者用ダッシュボード
            </div>
            <button className="tm-nav-link" onClick={() => setScreen("home")}>
              <Ic e="🏠" size={13} /> ホームへ
            </button>
          </div>

          <div className="tm-note">
            <Ic e="⚠️" size={13} /> このダッシュボードは「今あなたが開いているこのブラウザ」に保存されたデータだけを表示します。
            友達が自分のスマホやパソコンでこのページを開いて回答しても、そのデータはここには出てきません
            (複数の端末からデータを1か所に集めるには、別の仕組みが必要です)。
          </div>

          {researcherLoading && <p className="tm-empty">読み込み中…</p>}

          {!researcherLoading && researcherRecords && researcherRecords.length === 0 && (
            <p className="tm-empty">まだデータがありません。参加者にホーム画面から回答してもらいましょう。</p>
          )}

          {!researcherLoading && researcherRecords && researcherRecords.length > 0 && (
            <>
              <div className="tm-stat-cards">
                {aggregates.map((a) => (
                  <div className="tm-stat-card" key={a.key}>
                    <div className="label">
                      <span className="tm-dot" style={{ background: a.color }} />
                      {a.label}
                    </div>
                    <div className="value">
                      {a.avgCpm}
                      <small>文字/分</small>
                    </div>
                    <div className="value" style={{ fontSize: 18, marginTop: 4 }}>
                      {a.avgAcc}
                      <small>% 正確度</small>
                    </div>
                    <div className="n">n={a.n}</div>
                  </div>
                ))}
              </div>

              <div className="tm-chart-block">
                <div className="tm-chart-title">条件別 平均タイピング速度(文字/分)</div>
                <SimpleBarChart data={aggregates} valueKey="avgCpm" maxValue={maxCpm} unit="" />
              </div>

              <div className="tm-chart-block">
                <div className="tm-chart-title">条件別 平均正確度(%)</div>
                <SimpleBarChart data={aggregates} valueKey="avgAcc" maxValue={100} unit="%" />
              </div>

              <div className="tm-table-wrap">
                <table className="tm-table">
                  <thead>
                    <tr>
                      <th>参加者</th>
                      <th>条件</th>
                      <th>CPM</th>
                      <th>正確度</th>
                      <th>時間(秒)</th>
                      <th>日時</th>
                    </tr>
                  </thead>
                  <tbody>
                    {researcherRecords.map((r, i) => (
                      <tr key={i}>
                        <td>{r.participant}</td>
                        <td>{CONDITIONS[r.condition]?.label}</td>
                        <td>{r.cpm}</td>
                        <td>{r.accuracy}%</td>
                        <td>{r.elapsedSec}</td>
                        <td>{new Date(r.timestamp).toLocaleString("ja-JP")}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div className="tm-actions">
                <button className="tm-btn" onClick={handleExportCSV}>
                  <Ic e="⬇️" size={16} /> CSVをダウンロード
                </button>
                <button className="tm-btn ghost" onClick={loadResearcherData}>
                  再読み込み
                </button>
                <button className="tm-btn danger" onClick={() => setConfirmReset(true)}>
                  <Ic e="🗑️" size={16} /> 全データを削除
                </button>
              </div>

              {confirmReset && (
                <div className="tm-confirm-box" style={{ marginTop: 18 }}>
                  <p style={{ margin: "0 0 12px" }}>
                    <Ic e="⚠️" size={14} style={{ marginRight: 6 }} />
                    本当にすべてのデータを削除しますか?この操作は取り消せません。
                  </p>
                  <div className="tm-actions">
                    <button className="tm-btn danger" disabled={resetting} onClick={handleResetData}>
                      {resetting ? "削除中…" : "削除する"}
                    </button>
                    <button className="tm-btn ghost" onClick={() => setConfirmReset(false)}>
                      キャンセル
                    </button>
                  </div>
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TypingMusicStudy />);
</script>
</body>
</html>
